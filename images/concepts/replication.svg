<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">Replication follows treatment allocation</title><desc id="desc">Two pens receive different diets. Two animals per pen and two tubes per animal do not create independent pen treatment replication.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker></defs>
<rect width="1100" height="440" fill="#fff"/>
<text x="30" y="36" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#182c42">Replication follows treatment allocation</text>
<rect x="30" y="85" width="215" height="100" rx="9" fill="#fff1d6" stroke="#557488" stroke-width="1.5"/>
<text x="42" y="129.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182c42">Pen 1: diet A</text>
<text x="42" y="153.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#182c42">Allocation unit</text>
<rect x="370" y="75" width="210" height="60" rx="9" fill="#e5f2f5" stroke="#557488" stroke-width="1.5"/>
<text x="382" y="99.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182c42">Animal 1</text>
<text x="382" y="123.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#182c42">Biological observation</text>
<line x1="247" y1="135" x2="367" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="75" width="320" height="60" rx="9" fill="#e5f2f5" stroke="#557488" stroke-width="1.5"/>
<text x="742" y="99.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182c42">Tube 1 + Tube 2</text>
<text x="742" y="123.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#182c42">Repeated / technical measurements</text>
<line x1="582" y1="105" x2="727" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="370" y="155" width="210" height="60" rx="9" fill="#e5f2f5" stroke="#557488" stroke-width="1.5"/>
<text x="382" y="179.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182c42">Animal 2</text>
<text x="382" y="203.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#182c42">Biological observation</text>
<line x1="247" y1="135" x2="367" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="155" width="320" height="60" rx="9" fill="#e5f2f5" stroke="#557488" stroke-width="1.5"/>
<text x="742" y="179.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182c42">Tube 1 + Tube 2</text>
<text x="742" y="203.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#182c42">Repeated / technical measurements</text>
<line x1="582" y1="185" x2="727" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="260" width="215" height="100" rx="9" fill="#fff1d6" stroke="#557488" stroke-width="1.5"/>
<text x="42" y="304.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182c42">Pen 2: diet B</text>
<text x="42" y="328.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#182c42">Allocation unit</text>
<rect x="370" y="250" width="210" height="60" rx="9" fill="#e5f2f5" stroke="#557488" stroke-width="1.5"/>
<text x="382" y="274.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182c42">Animal 3</text>
<text x="382" y="298.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#182c42">Biological observation</text>
<line x1="247" y1="310" x2="367" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="250" width="320" height="60" rx="9" fill="#e5f2f5" stroke="#557488" stroke-width="1.5"/>
<text x="742" y="274.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182c42">Tube 1 + Tube 2</text>
<text x="742" y="298.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#182c42">Repeated / technical measurements</text>
<line x1="582" y1="280" x2="727" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="370" y="330" width="210" height="60" rx="9" fill="#e5f2f5" stroke="#557488" stroke-width="1.5"/>
<text x="382" y="354.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182c42">Animal 4</text>
<text x="382" y="378.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#182c42">Biological observation</text>
<line x1="247" y1="310" x2="367" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="330" width="320" height="60" rx="9" fill="#e5f2f5" stroke="#557488" stroke-width="1.5"/>
<text x="742" y="354.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182c42">Tube 1 + Tube 2</text>
<text x="742" y="378.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#182c42">Repeated / technical measurements</text>
<line x1="582" y1="360" x2="727" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#182c42">With one pen per diet, diet and pen are confounded. More tubes cannot resolve that.</text>
</svg>